<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LookUp - Discord user</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <meta name="theme-color" content="#000000">
</head>
<body class="theme-utdr">

    <div id="box">
        <div class="header-container">
            <div>
                <h1>Lookup - Discord User</h1>
                <p id="subtitle"><a href="index.html" style="color: #ffe700;"><- Back to landing</a></p>
                <p id="subtitle">Insert a Discord user ID to get the information provided by the Discord API</p>
            </div>
        </div>

        <div class="controls-wrapper" style="margin-top: 20px;">
            <input type="text" id="dcSearchInput" class="search-bar" placeholder="Enter Discord user ID">
            <button id="dcSearchBtn" class="btn-action">Search</button>
        </div>

        <div id="resultContainer" style="margin-top: 20px;">

        <p style="text-align: center; margin-top: 40px; font-size: 9pt; color: #888;">
            Notice: If you keep encountering errors while searching for users, it may be due to the Discord API or due to API rate limits, Or, the user you are searching for doesn't exist.
        </p>
        </div>
    </div>

    <script src="js/rate_limiter.js"></script>
    <script src="js/dc_users_handler.js"></script>
</body>
</html>
