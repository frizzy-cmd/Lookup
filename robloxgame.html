<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookup - Roblox game</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="box">
        <h1>Lookup - Roblox Game</h1>
        <a href="index.html" class="nav-back"><- Back to landing</a>
        <p id="subtitle">Insert a Roblox game ID or URL to get the information provided by the Roblox API</p>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <input type="text" id="gameSearchInput" placeholder="Enter ID or URL" style="flex-grow: 1;">
            <button id="gameSearchBtn" class="btn-action">Search</button>
        </div>

        <div id="resultContainer" style="margin-top: 20px;"></div>

        <p style="text-align: center; margin-top: 40px; font-size: 9pt; color: #888;">
            Notice: If you keep encountering errors while searching for users, it may be due to the Roblox API or due to API rate limits, Or, the game you are searching for doesn't exist.
        </p>
    </div>

    <script src="js/rate_limiter.js"></script>
    <script src="js/rblx_games_handler.js"></script>
</body>
</html>
